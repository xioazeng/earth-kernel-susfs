name: Repack boot.img only (no kernel rebuild)

# =============================================================================
#  Fast iteration for the repack step ONLY.
#
#  The kernel images from a previous successful build are reused, so this takes
#  under a minute instead of rebuilding for ~40 minutes. Use this whenever the
#  kernel compiled fine but the boot.img repack needs another attempt.
#
#  How to use:
#    1. Run "Build earth kernel ..." once and download the
#       "earth-kernel-images" artifact; it contains Image.gz-dtb.
#    2. Commit your stock boot.img to the repo root as  stock-boot.img
#    3. Run THIS workflow and paste a download URL for the kernel artifact:
#         - easiest: upload Image.gz-dtb to the same Release as boot.img
#         - or paste the artifact's download URL (needs a token for private repos)
# =============================================================================

on:
  workflow_dispatch:
    inputs:
      kernel_image_url:
        description: 'Direct download URL of Image.gz-dtb from a previous build'
        required: true
      dtb_file:
        description: 'Name of a dtb from kernel/dist/dtb to use (leave empty to keep the stock dtb)'
        required: false
        default: ''
      dtb_url:
        description: 'Optional direct URL of a .dtb to use instead of the stock one'
        required: false
        default: ''
      magisk_asset:
        description: 'Magisk release to take magiskboot from'
        required: false
        default: 'latest'

permissions:
  contents: read

jobs:
  repack:
    name: Repack boot.img
    runs-on: ubuntu-22.04
    timeout-minutes: 15

    steps:
      - name: Checkout build kit
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Locate stock boot.img
        id: bootimg
        run: |
          set -euo pipefail
          if [ ! -f "stock-boot.img" ]; then
            echo "::error title=stock-boot.img missing::Commit your stock boot.img to the repo root as 'stock-boot.img'."
            exit 1
          fi
          cp stock-boot.img stock.img
          ls -la stock.img
          echo "have=1" >> "$GITHUB_OUTPUT"

      - name: Download kernel image
        run: |
          set -euo pipefail
          mkdir -p kernel/dist
          curl -fL --retry 3 "${{ inputs.kernel_image_url }}" -o kernel/dist/Image.gz-dtb
          ls -la kernel/dist/
          echo "--- verify it is really a gzip kernel image, not an HTML page ---"
          head -c 4 kernel/dist/Image.gz-dtb | xxd || true
          if ! gzip -t kernel/dist/Image.gz-dtb 2>/dev/null; then
            echo "::warning title=Not a gzip file::The downloaded file does not look like a gzipped kernel image. If the URL was a web page, use a direct download link instead."
          fi

      - name: Download optional dtb
        if: inputs.dtb_url != ''
        run: |
          set -euo pipefail
          curl -fL --retry 3 "${{ inputs.dtb_url }}" -o kernel/dist/dtb-custom.dtb
          ls -la kernel/dist/dtb-custom.dtb

      - name: Download magiskboot
        run: |
          set -euo pipefail
          mkdir -p magiskboot-dir
          if [ "${{ inputs.magisk_asset }}" = "latest" ]; then
            API=https://api.github.com/repos/topjohnwu/Magisk/releases/latest
          else
            API=https://api.github.com/repos/topjohnwu/Magisk/releases/tags/${{ inputs.magisk_asset }}
          fi
          curl -fsSL "$API" -o magisk-release.json
          APK_URL=$(grep -o '"browser_download_url":[^,]*Magisk[^,]*\.apk"' magisk-release.json \
                    | grep -v app-debug | head -1 \
                    | sed -e 's/.*"browser_download_url":[[:space:]]*"//' -e 's/"$//')
          echo "resolved: $(basename "$APK_URL")"
          curl -fsSL "$APK_URL" -o magisk.apk
          unzip -o -j magisk.apk 'lib/x86_64/libmagiskboot.so' -d magiskboot-dir
          mv magiskboot-dir/libmagiskboot.so magiskboot-dir/magiskboot
          chmod +x magiskboot-dir/magiskboot
          echo "$PWD/magiskboot-dir" >> "$GITHUB_PATH"
          ./magiskboot-dir/magiskboot 2>&1 | head -3 || true

      - name: Repack boot.img
        run: |
          set -euo pipefail
          NEW_KERNEL=""
          for CAND in kernel/dist/Image.gz-dtb kernel/dist/Image-dtb kernel/dist/Image.gz kernel/dist/Image; do
            if [ -f "$CAND" ]; then NEW_KERNEL="$CAND"; break; fi
          done
          if [ -z "$NEW_KERNEL" ]; then
            echo "::error title=No kernel payload::No kernel image found."
            ls -la kernel/dist || true
            exit 1
          fi
          echo "using kernel payload: $NEW_KERNEL ($(stat -c%s "$NEW_KERNEL") bytes)"

          DTB_ARG=""
          if [ -n "${{ inputs.dtb_file }}" ] && [ -f "kernel/dist/${{ inputs.dtb_file }}" ]; then
            DTB_ARG="kernel/dist/${{ inputs.dtb_file }}"
          elif [ -f kernel/dist/dtb-custom.dtb ]; then
            DTB_ARG="kernel/dist/dtb-custom.dtb"
          fi
          echo "dtb argument: ${DTB_ARG:-<none, keeping stock boot.img dtb>}"

          chmod +x scripts/repack-bootimg.sh
          ./scripts/repack-bootimg.sh stock.img "$NEW_KERNEL" earth-boot-new.img $DTB_ARG 2>&1 | tee repack.log
          ls -la earth-boot-new.img

      - name: Upload boot.img
        uses: actions/upload-artifact@v4
        with:
          name: earth-boot-img
          path: earth-boot-new.img
          if-no-files-found: error

      - name: Upload repack log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: earth-repack-log
          path: repack.log
          if-no-files-found: warn
