name: Build earth kernel (KernelSU-Next + SUSFS + Droidspaces)

# =============================================================================
#  Xiaomi Redmi 12C / Poco C55  ("earth", MediaTek MT6768)
#  Base tree : LineageOS/android_kernel_xiaomi_earth @ lineage-21  (Linux 4.19)
#  Features  : KernelSU-Next v3.4.2 + SUSFS (kernel-4.19) + Droidspaces
#  Output    : flashable boot.img (kernel swapped inside your stock boot.img)
#              + raw Image.gz-dtb and the full build log
#
#  How to run:
#    Actions -> "Build earth kernel ..." -> Run workflow
#
#  To get a flashable boot.img you must supply your stock boot.img, in one of
#  two ways (see README "云端编译完整教程"):
#    A) commit it to the repo root as  stock-boot.img      <-- easiest
#    B) or paste a direct download URL into stock_boot_img_url at dispatch
# =============================================================================

on:
  workflow_dispatch:
    inputs:
      kernel_repo:
        description: 'Kernel source repository'
        required: false
        default: 'LineageOS/android_kernel_xiaomi_earth'
      kernel_ref:
        description: 'Kernel branch/tag/commit'
        required: false
        default: 'lineage-21'
      defconfig:
        description: 'Defconfig name (without _defconfig)'
        required: false
        default: 'earth'
      kernelsu_ref:
        description: 'KernelSU-Next ref (tag/branch/commit)'
        required: false
        default: 'v3.4.2'
      susfs_ref:
        description: 'SUSFS branch (susfs4ksu)'
        required: false
        default: 'kernel-4.19'
      susfs_enable:
        description: 'Apply SUSFS (1 = yes, 0 = KernelSU-Next only). Port in progress.'
        required: false
        default: '0'
      stock_boot_img_url:
        description: 'Direct download URL of YOUR stock boot.img (optional; see tutorial)'
        required: false
        default: ''

# Manual runs only. No push trigger on purpose: a push would start a build
# with an empty stock_boot_img_url, producing no boot.img and confusing things.
permissions:
  contents: read

jobs:
  build:
    name: Build kernel
    runs-on: ubuntu-22.04
    timeout-minutes: 240

    steps:
      - name: Checkout build kit
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Show environment
        run: |
          echo "runner CPUs : $(nproc)"
          echo "disk        : $(df -h / | tail -1)"
          echo "memory      : $(free -h | head -2)"

      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android/sdk /opt/ghc \
                      /usr/local/share/boost "$AGENT_TOOLSDIRECTORY" 2>/dev/null || true
          df -h /

      - name: Install build dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq \
            bc bison build-essential ccache curl flex g++-multilib gcc-multilib \
            git gnupg gperf imagemagick lib32ncurses5-dev lib32readline-dev \
            lib32z1-dev libelf-dev liblz4-tool libncurses5 libncurses5-dev \
            libsdl1.2-dev libssl-dev libxml2 libxml2-utils lzop pngcrush \
            rsync schedtool squashfs-tools xsltproc zip zlib1g-dev python3 \
            unzip device-tree-compiler cpio

          # Optional GCC cross-compiler, used only as a fallback by the build.
          # Name varies between Ubuntu releases, so try the known aliases and
          # never fail the job here: clang + LLVM=1 + LLVM_IAS=1 is the primary
          # toolchain. (This kernel has no CONFIG_COMPAT, so no 32-bit is built.)
          sudo apt-get install -y -qq gcc-aarch64-linux-gnu binutils-aarch64-linux-gnu \
            || sudo apt-get install -y -qq gcc-11-aarch64-linux-gnu \
            || sudo apt-get install -y -qq gcc-12-aarch64-linux-gnu \
            || echo "::warning title=No GCC cross-compiler::clang-only build will be used."
          if command -v aarch64-linux-gnu-elfedit >/dev/null 2>&1; then
            echo "GCC64_PATH=/usr" >> "$GITHUB_ENV"
            aarch64-linux-gnu-gcc --version | head -1
          else
            echo "aarch64-linux-gnu-elfedit not present - building clang-only."
          fi

      - name: Download Android build-tools (mkdtimg / libufdt)
        run: |
          # Mirrored on GitHub: googlesource is slow/flaky from CI runners and
          # the same host already caused a failure in an earlier run.
          git clone --depth 1 https://github.com/LineageOS/android_system_libufdt.git build-tools/libufdt
          echo "BUILDTOOLS_PATH=$PWD/build-tools" >> "$GITHUB_ENV"
          ls build-tools/libufdt | head

      - name: Checkout kernel source
        run: |
          git clone --depth 1 --branch "${{ inputs.kernel_ref || 'lineage-21' }}" \
            "https://github.com/${{ inputs.kernel_repo || 'LineageOS/android_kernel_xiaomi_earth' }}.git" \
            kernel
          echo "KERNEL_SHA=$(git -C kernel rev-parse HEAD)" >> "$GITHUB_ENV"
          echo "kernel HEAD: $(git -C kernel rev-parse --short HEAD)"
          sed -n '1,6p' kernel/Makefile

      # Toolchain note: this is the prebuilt clang LineageOS itself uses to build
      # kernel 4.19 for lineage-20. Do NOT swap in an Android 14/15/16 clang
      # (clang-r4xxxxxx from android13+): those are too new for a 4.19 tree and
      # fail on legacy constructs. r416183b is the safe, proven choice here.
      - name: Download clang toolchain (LineageOS r416183b for kernel 4.19)
        run: |
          set -euo pipefail
          mkdir -p toolchains
          OK=0
          for REPO in \
            LineageOS/android_prebuilts_clang_kernel_linux-x86_clang-r416183b \
            AOSPA/android_prebuilts_clang_kernel_linux-x86_clang-r416183b ; do
            echo "trying $REPO ..."
            if git clone --depth 1 "https://github.com/${REPO}.git" toolchains/clang-src 2>/dev/null; then
              OK=1
              echo "cloned $REPO"
              break
            fi
            rm -rf toolchains/clang-src
          done
          if [ "$OK" -ne 1 ]; then
            echo "::error title=clang download failed::Could not clone a prebuilt clang toolchain from any known mirror."
            exit 1
          fi
          mv toolchains/clang-src toolchains/clang
          rm -rf toolchains/clang/.git
          echo "CLANG_PATH=$PWD/toolchains/clang" >> "$GITHUB_ENV"
          ls toolchains/clang
          "$PWD/toolchains/clang/bin/clang" --version | head -2

      - name: Integrate KernelSU-Next + SUSFS + Droidspaces
        env:
          DEFCONFIG: ${{ inputs.defconfig || 'earth' }}
          SUSFS_ENABLE: ${{ inputs.susfs_enable || '0' }}
        run: |
          chmod +x scripts/*.sh
          ./scripts/setup-kernel.sh "$PWD/kernel" 2>&1 | tee setup.log
          echo "--- patch reject files (if any) ---"
          find kernel -name '*.rej' | head -50 || true

      - name: Build kernel
        env:
          DEFCONFIG: ${{ inputs.defconfig || 'earth' }}
          SUSFS_ENABLE: ${{ inputs.susfs_enable || '0' }}
        run: |
          JOBS="$(nproc)"
          JOBS="$JOBS" ./scripts/build.sh "$PWD/kernel" 2>&1 | tee build.log

      - name: Prepare stock boot.img
        id: bootimg
        env:
          BOOT_URL: ${{ inputs.stock_boot_img_url || '' }}
        run: |
          set -euo pipefail
          HAVE=0
          # Priority 1: a stock-boot.img committed at the repo root.
          if [ -f "stock-boot.img" ]; then
            echo "using committed stock-boot.img"
            cp stock-boot.img stock.img
            HAVE=1
          # Priority 2: an explicit download URL given at dispatch time.
          elif [ -n "${BOOT_URL}" ]; then
            echo "downloading stock boot.img from the supplied URL"
            if curl -fL --retry 3 --retry-delay 2 "${BOOT_URL}" -o stock.img; then
              HAVE=1
            else
              echo "::error title=boot.img download failed::Could not download the boot.img URL. Check that the link is a direct, public download link."
            fi
          fi

          if [ "$HAVE" -eq 0 ]; then
            echo "have=0" >> "$GITHUB_OUTPUT"
            echo "::warning title=No boot.img::No stock boot.img provided - only the raw kernel image will be built. Flashable boot.img will be skipped."
            exit 0
          fi

          echo "have=1" >> "$GITHUB_OUTPUT"
          ls -la stock.img
          echo "--- sanity check (Android boot images start with the ANDROID! magic) ---"
          MAGIC=$(head -c 8 stock.img | tr -d '\0' || true)
          echo "magic bytes: '${MAGIC}'"
          if [ "$MAGIC" != "ANDROID!" ]; then
            echo "::error title=Not a valid boot.img::The file does not start with 'ANDROID!'. It is probably not a raw Android boot image, or the download returned an HTML page instead of the file."
            exit 1
          fi
          echo "boot.img magic OK"

      - name: Download magiskboot
        if: steps.bootimg.outputs.have == '1'
        run: |
          set -euo pipefail
          mkdir -p magiskboot-dir

          # Ask the API for the real asset URL instead of constructing the file
          # name ourselves. Magisk has changed its asset naming before
          # (e.g. v30.7 ships "Magisk-v30.7.apk", not "Magisk-30.7.apk"), and
          # guessing it is exactly what broke an earlier run.
          #
          # We use `curl -o` rather than a command substitution: when a command
          # substitution is used to capture the JSON, GitHub blanks the whole
          # thing as a secret because the body contains private-repo URLs.
          curl -fsSL https://api.github.com/repos/topjohnwu/Magisk/releases/latest -o magisk-release.json
          APK_URL=$(grep -o '"browser_download_url":[^,]*Magisk[^,]*\.apk"' magisk-release.json \
                    | grep -v app-debug | head -1 \
                    | sed -e 's/.*"browser_download_url":[[:space:]]*"//' -e 's/"$//')
          APK_NAME=$(basename "$APK_URL")
          if [ -z "$APK_URL" ]; then
            echo "::error title=Magisk asset not found::Could not find a Magisk APK asset in the latest release."
            exit 1
          fi
          echo "resolved Magisk asset: $APK_NAME"

          curl -fsSL "$APK_URL" -o magisk.apk

          # libmagiskboot.so is the magiskboot binary; on x86_64 runners it is
          # under lib/x86_64/. Print the APK contents if that path ever moves.
          unzip -o -j magisk.apk 'lib/x86_64/libmagiskboot.so' -d magiskboot-dir \
            || { echo "--- APK contents (lib/*) ---"; unzip -l magisk.apk | grep -i 'lib/' || true; exit 1; }

          mv magiskboot-dir/libmagiskboot.so magiskboot-dir/magiskboot
          chmod +x magiskboot-dir/magiskboot
          echo "$PWD/magiskboot-dir" >> "$GITHUB_PATH"
          ./magiskboot-dir/magiskboot 2>&1 | head -3 || true

      - name: Repack boot.img
        if: steps.bootimg.outputs.have == '1'
        run: |
          set -euo pipefail
          # Resolve the flashable payload. The appended-DTB target
          # (Image.gz-dtb) is what this device needs; a bare Image.gz has no
          # device tree. Fail with the real directory listing if neither
          # exists, instead of passing an empty argument downstream.
          NEW_KERNEL=""
          for CAND in kernel/dist/Image.gz-dtb kernel/dist/Image-dtb kernel/dist/Image.gz kernel/dist/Image; do
            if [ -f "$CAND" ]; then NEW_KERNEL="$CAND"; break; fi
          done
          if [ -z "$NEW_KERNEL" ]; then
            echo "::error title=No kernel payload::No flashable kernel image was produced."
            echo "--- kernel/dist ---"
            ls -la kernel/dist 2>/dev/null || echo "(no dist directory)"
            echo "--- out/arch/arm64/boot ---"
            ls -la kernel/out/arch/arm64/boot 2>/dev/null || echo "(no boot output directory)"
            echo "--- workspace root ---"
            ls -la . | head -40
            exit 1
          fi
          echo "using kernel payload: $NEW_KERNEL ($(stat -c%s "$NEW_KERNEL") bytes)"

          chmod +x scripts/repack-bootimg.sh
          ./scripts/repack-bootimg.sh stock.img "$NEW_KERNEL" earth-boot-new.img 2>&1 | tee repack.log
          ls -la earth-boot-new.img

      - name: Summarize results
        if: always()
        run: |
          {
            echo "## earth kernel build"
            echo ""
            echo "| item | value |"
            echo "|---|---|"
            echo "| kernel repo | \`${{ inputs.kernel_repo || 'LineageOS/android_kernel_xiaomi_earth' }}\` |"
            echo "| kernel ref | \`${{ inputs.kernel_ref || 'lineage-21' }}\` |"
            echo "| kernel commit | \`${KERNEL_SHA}\` |"
            echo "| KernelSU-Next | \`${{ inputs.kernelsu_ref || 'v3.4.2' }}\` |"
            echo "| SUSFS | \`${{ inputs.susfs_ref || 'kernel-4.19' }}\` |"
            echo "| clang | \`clang-r416183b\` (LineageOS prebuilt for kernel 4.19) |"
            echo "| stock boot.img | ${{ steps.bootimg.outputs.have == '1' && 'provided - boot.img will be produced' || 'not provided - raw kernel only' }} |"
            echo ""
            echo '### Artifacts'
            echo '```'
            ls -la kernel/dist 2>/dev/null || echo 'no dist dir'
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload kernel images
        uses: actions/upload-artifact@v4
        with:
          name: earth-kernel-images
          path: |
            kernel/dist/Image.gz-dtb
            kernel/dist/Image-dtb
            kernel/dist/Image.gz
            kernel/dist/Image
            kernel/dist/kernel.config
            kernel/dist/kernel.release
          if-no-files-found: warn

      - name: Upload flashable boot.img
        if: steps.bootimg.outputs.have == '1'
        uses: actions/upload-artifact@v4
        with:
          name: earth-boot-img
          path: earth-boot-new.img
          if-no-files-found: error

      - name: Upload logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: earth-build-logs
          path: |
            setup.log
            build.log
            build-error.log
            repack.log
          if-no-files-found: warn
